services:
  mongo:
    image: mongo:7
    container_name: smt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: smt-backend
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongo
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: smt-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
