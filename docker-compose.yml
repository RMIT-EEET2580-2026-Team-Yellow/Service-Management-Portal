services:
  mongo:
    image: mongo:7
    container_name: smt-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: smt-backend
    ports:
      - "8080:8080"
    # Real default values baked in directly (not `- VAR` pass-through) so `docker compose up`
    # works with zero setup — no .env file to copy first. `${VAR:-default}` still lets anyone
    # override a value via a real environment variable or a root .env file if they want to,
    # without that being required.
    environment:
      - MONGO_HOST=mongo
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/smt}
      - MONGO_URI_NORTHERN=${MONGO_URI_NORTHERN:-mongodb://mongo:27017/smt_northern}
      - MONGO_URI_SOUTHERN=${MONGO_URI_SOUTHERN:-mongodb://mongo:27017/smt_southern}
      - STORAGE_UPLOAD_DIR=/data/uploads
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-794584079050-ir6jcdpsb5pe7l9fj7djkveurg8mbieb.apps.googleusercontent.com}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    # A plain TCP check (not an HTTP one) on purpose: 8080 serves HTTPS with a self-signed cert
    # (PR #166), so a bare curl/wget would need extra -k/--no-check-certificate flags for no real
    # benefit — we only need to know Tomcat has finished binding the port, which means Spring's
    # ApplicationContext (and therefore every CommandLineRunner seeder) has already finished.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: smt-frontend
    ports:
      - "5173:5173"
    # Same idea as the backend above: a real default baked in, Vite picks up process.env vars
    # prefixed VITE_ even with no frontend/.env file present, so no copy step is required here
    # either. VITE_GOOGLE_CLIENT_ID must match the backend's GOOGLE_CLIENT_ID above (same OAuth
    # client on both sides) — override both together if you ever swap it out.
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-794584079050-ir6jcdpsb5pe7l9fj7djkveurg8mbieb.apps.googleusercontent.com}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:
