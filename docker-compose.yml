services:
  mongo:
    image: mongo:7
    container_name: smt-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: smt-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_HOST=mongo
      - MONGO_URI
      - MONGO_URI_NORTHERN
      - MONGO_URI_SOUTHERN
      - STORAGE_UPLOAD_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: smt-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
