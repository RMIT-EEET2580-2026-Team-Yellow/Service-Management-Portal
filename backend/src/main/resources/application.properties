spring.application.name=service-management-portal

# Default Mongo connection (spring-boot-starter-data-mongodb autoconfiguration)
# MONGO_HOST defaults to localhost for regular (non-Docker) local dev; docker-compose.yml
# overrides it to "mongo" (the compose service name) when running in containers.
# NOTE: Spring Boot 4 moved the connection URI property from spring.data.mongodb.uri to
# spring.mongodb.uri (spring.data.mongodb.* is now data/repository-layer config only).
spring.mongodb.uri=${MONGO_URI:mongodb://${MONGO_HOST:localhost}:27017/smt}
# Explicit database name — forces the target DB regardless of how the driver parses the URI path
spring.data.mongodb.database=smt

# Region shards for Staff data (SRS 3.1.U1/U2) - see common.config.MongoShardConfig
# Defaults to local Docker Mongo; set MONGO_URI_NORTHERN/MONGO_URI_SOUTHERN in .env to point
# these at a shared Atlas cluster instead (so the whole team sees the same sharded data).
smt.mongo.northern-uri=${MONGO_URI_NORTHERN:mongodb://${MONGO_HOST:localhost}:27017/smt_northern}
smt.mongo.southern-uri=${MONGO_URI_SOUTHERN:mongodb://${MONGO_HOST:localhost}:27017/smt_southern}

# JWT (SRS 3.2.M1-M3) - RS256 via keystore (matches SBT/SBP's approach), not HMAC.
# ase_project.keystore ships in resources for dev; override the password via env var in production.
smt.jwt.keystore-path=classpath:ase_project.keystore
smt.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD:aseproject}
smt.jwt.expiration-minutes=60

# SERVICE-role token for SBT's backend to call our external endpoints (server-to-server, per
# "Message to SMT.md"). This secret must be shared with SBT out-of-band (not committed for real
# use) and set identically as their side's expected value.
smt.service.auth-secret=${SBP_SERVICE_SECRET:CHANGE_ME_share_this_with_SBT_out_of_band}
smt.service.subject=sbp-service

# CORS trusted origin (A.2.6) - the SMP frontend (Vite dev server default is http, not https)
smt.cors.allowed-origin=http://localhost:5173

# SBP integration (4.M1) - toggle real vs mock while SBP's API is not yet available (4.S2)
smt.integration.sbp.base-url=https://localhost:8443/api/v1
smt.integration.sbp.use-mock=true
